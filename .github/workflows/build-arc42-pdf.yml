name: Build and Commit arc42 PDF

on:
  push:
    paths:
      - "docs/SAA/arc42-doc.md"
      - ".github/workflows/build-arc42-pdf.yml"
  pull_request:
    paths:
      - "docs/SAA/arc42-doc.md"
      - ".github/workflows/build-arc42-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install Pandoc and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra

      - name: Preprocess Mermaid diagrams
        run: |
          mkdir -p build/mermaid
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('docs/SAA/arc42-doc.md').read_text(encoding='utf-8')
          pattern = re.compile(r'```mermaid\s*\n(.*?)\n```', re.DOTALL)
          out_dir = Path('build/mermaid')
          counter = [1]

          def repl(match):
              diagram = match.group(1)
              idx = counter[0]
              mmd_file = out_dir / f'diagram-{idx}.mmd'
              png_file = out_dir / f'diagram-{idx}.png'
              mmd_file.write_text(diagram, encoding='utf-8')
              counter[0] += 1
              return f'![Mermaid diagram {idx}]({png_file.as_posix()})'

          new_md = pattern.sub(repl, src)
          Path('build/arc42-preprocessed.md').write_text(new_md, encoding='utf-8')
          PY

      - name: Generate Mermaid PNGs
        run: |
          shopt -s nullglob
          for f in build/mermaid/*.mmd; do
            npx mmdc -i "$f" -o "${f%.mmd}.png"
          done

      - name: Build PDF with Pandoc
        run: |
          pandoc build/arc42-preprocessed.md \
            --from markdown \
            --to pdf \
            --pdf-engine=xelatex \
            --metadata title="Tumor Classifier Architecture Documentation" \
            -V geometry:margin=1in \
            -o docs/SAA/arc42-doc.pdf

      - name: Commit PDF if changed
        run: |
          if git diff --quiet -- docs/SAA/arc42-doc.pdf; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/SAA/arc42-doc.pdf
          git commit -m "Update arc42 PDF"
          git push
